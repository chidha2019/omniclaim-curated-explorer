receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 1048576
        tls:
          cert_file: /tls/tls.crt
          key_file: /tls/tls.key
          client_ca_file: /tls/ca.crt
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 700
    spike_limit_mib: 150
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment.name"])
      - context: span
        statements:
          - keep_keys(attributes, ["http.route", "http.request.method", "http.response.status_code", "db.system.name", "db.query.id", "app.dataset", "telemetry.source"])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment.name"])
      - context: datapoint
        statements:
          - keep_keys(attributes, ["route", "method", "status_class", "status_code", "dataset", "tenant"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment.name"])
      - context: log
        statements:
          - keep_keys(attributes, ["request_id", "trace_id", "actor", "tenant", "route", "method", "status", "duration_ms", "code"])
          - set(body, "redacted") where body != "request_completed" and body != "dependency_probe_failed"
  batch:
    send_batch_size: 512
    timeout: 5s
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/storage
    create_directory: true
exporters:
  otlp_http/backend:
    endpoint: ${env:OTLP_BACKEND_ENDPOINT}
    headers:
      Authorization: Bearer ${env:OTLP_BACKEND_TOKEN}
    tls:
      ca_file: /backend-tls/ca.crt
    compression: gzip
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 10000
      storage: file_storage
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 20m
    resource_to_telemetry_conversion:
      enabled: true
service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
      encoding: json
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/backend]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [prometheus, otlp_http/backend]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/backend]
