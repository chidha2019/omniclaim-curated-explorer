apiVersion: v1
kind: ConfigMap
metadata: {name: {{ .Release.Name }}-collector}
data:
  collector.yaml: |
{{ .Files.Get "files/collector.yaml" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-collector
  labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: collector}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, component: collector}
  ports:
    - {name: otlp, port: 4318, targetPort: 4318}
    - {name: metrics, port: 8889, targetPort: 8889}
    - {name: internal, port: 8888, targetPort: 8888}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ .Release.Name }}-collector}
spec:
  serviceName: {{ .Release.Name }}-collector
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: collector}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: collector}
      annotations:
        checksum/config: {{ .Files.Get "files/collector.yaml" | sha256sum }}
    spec:
      nodeSelector: {kubernetes.io/arch: amd64}
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: {{ .Values.collector.image | quote }}
          args: ["--config=/etc/otelcol/collector.yaml"]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ .Values.collector.resources | toJson }}
          env:
            - name: OTLP_BACKEND_ENDPOINT
              valueFrom: {secretKeyRef: {name: {{ .Values.collector.backendSecret }}, key: OTLP_BACKEND_ENDPOINT}}
            - name: OTLP_BACKEND_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.collector.backendSecret }}, key: OTLP_BACKEND_TOKEN}}
          ports: [{name: otlp, containerPort: 4318}, {name: metrics, containerPort: 8889}, {name: internal, containerPort: 8888}, {name: health, containerPort: 13133}]
          readinessProbe: {httpGet: {path: /, port: health}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: health}, periodSeconds: 15}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: backend-tls, mountPath: /backend-tls, readOnly: true}
            - {name: storage, mountPath: /var/lib/otelcol}
      volumes:
        - {name: config, configMap: {name: {{ .Release.Name }}-collector}}
        - {name: tls, secret: {secretName: {{ .Values.collector.tlsSecret }}, defaultMode: 0440}}
        - name: backend-tls
          secret:
            secretName: {{ .Values.collector.backendSecret }}
            items: [{key: ca.crt, path: ca.crt}]
  volumeClaimTemplates:
    - metadata: {name: storage}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.collector.storageClass }}
        storageClassName: {{ .Values.collector.storageClass | quote }}
        {{- end }}
        resources: {requests: {storage: {{ .Values.collector.storageSize }}}}
