apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-data-monitor
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: {app.kubernetes.io/instance: {{ .Release.Name }}, component: monitor}
        spec:
          nodeSelector: {kubernetes.io/arch: amd64}
          restartPolicy: Never
          serviceAccountName: {{ .Release.Name }}
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: monitor
              image: {{ .Values.api.image | quote }}
              command: [python, -m, app.monitor]
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              env:
                - name: POD_NAME
                  value: omniclaim-monitor
                {{- include "explorer.env" . | nindent 16 }}
              resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: secrets, mountPath: /secrets, readOnly: true}
                - {name: tls, mountPath: /tls, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: config, configMap: {name: {{ .Release.Name }}-config}}
            - {name: secrets, secret: {secretName: {{ .Values.app.secretName }}, defaultMode: 0440}}
            - {name: tls, secret: {secretName: {{ .Values.app.clientTlsSecret }}, defaultMode: 0440}}
            - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
