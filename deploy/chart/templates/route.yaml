apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames: [{{ .Values.app.host | quote }}]
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      timeouts: {request: 50s, backendRequest: 45s}
      backendRefs: [{name: {{ .Release.Name }}-web, port: 8080}]
