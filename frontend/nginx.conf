worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  client_max_body_size 64k;
  # Exclude $request and $request_uri: they contain customer search text.
  log_format safe escape=json '{"service":"omniclaim-web","method":"$request_method","status":$status,"duration":$request_time,"request_id":"$upstream_http_x_request_id","trace_id":"$upstream_http_x_trace_id"}';
  access_log /dev/stdout safe;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Production chart replaces this file with a CSP allowing only the configured HTTPS IdP origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ ^/(health/|metrics|docs|openapi\.json) { return 404; }
    location /api/ {
      proxy_pass http://explorer-api:8000;
      proxy_connect_timeout 5s;
      proxy_read_timeout 45s;
      proxy_send_timeout 10s;
      proxy_next_upstream off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_buffering off;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
  }
}
