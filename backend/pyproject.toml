[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "B008", "S311", "UP046"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

"app/sql.py" = ["S608"] # All identifiers validated/allowlisted; business values are bound.
